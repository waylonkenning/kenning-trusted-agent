[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kenning-trusted-agent"
version = "1.0.0"
description = "Self-hosted identity, policy, approval, audit, and proof controls for AI agents."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "Waylon Kenning" }]
dependencies = ["boto3>=1.34,<2"]

[project.optional-dependencies]
dev = [
  "coverage>=7,<8",
  "pytest>=8,<9",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "sdk*"]
