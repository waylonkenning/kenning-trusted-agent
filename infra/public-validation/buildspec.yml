version: 0.2

# This buildspec is credential-free. It is suitable for a public fork's
# CodeBuild project. It must not receive AWS roles, PATs, customer data, or
# production environment variables.
phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 22
    commands:
      - python3 -m venv .venv
      - .venv/bin/python -m pip install --requirement requirements-dev.txt
      - npm --prefix portal ci --ignore-scripts
      - mkdir -p "$HOME/bin"
      - curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz -C "$HOME/bin" gitleaks
  build:
    commands:
      - PATH="$HOME/bin:$PATH" bash scripts/public_validation.sh
